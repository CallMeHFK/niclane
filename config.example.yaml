# niclane configuration — one NIC, one lane.
#
# Each lane runs a local proxy listener whose egress is pinned to one network
# interface. Full reference: README.md / README.zh-CN.md.

# Admin endpoint: Prometheus metrics at /metrics, JSON status at /status.
admin: 127.0.0.1:9000

# debug | info | warn | error
log_level: info

# Proxy ports auto-discovery TCP-checks on each device's own gateway. Extend
# this for your hardware (common: 10808/10809 V2rayNG, 7890/7891 Clash).
# A lane can override it with `discover.ports`. Linux-only feature.
# discovery:
#   ports: [10808, 10809, 7890, 7891]

lanes:
  # --- WiFi NIC -------------------------------------------------------------
  - name: wifi
    listen: 127.0.0.1:7891
    type: socks5               # socks5 | http
    interface: wlan0        # egress pinned to this NIC
    # bind_mode: auto          # device | ip | auto (default auto)
    # strict: true             # default: reject while the NIC is down/unaddressed
    # auth:                    # optional inbound SOCKS5 auth
    #   user: han
    #   password: change-me
    dns_servers: [223.5.5.5, 1.1.1.1]   # replaces loopback NS (systemd-resolved)
    # dns: doh                          # DNS-over-HTTPS through the lane instead
    # doh: ["https://223.5.5.5/resolve", "https://1.1.1.1/dns-query"]
    # idle_timeout: 5m

  # --- USB dock NIC, HTTP proxy variant -------------------------------------
  - name: dock
    listen: 127.0.0.1:7892
    type: http
    interface: enx020000000002

  # --- Ride the TUN-mode proxy deliberately ---------------------------------
  - name: tunnel
    listen: 127.0.0.1:7893
    type: socks5
    interface: Mihomo          # the TUN device is just another "NIC"

  # --- Chain to SocksBypass on the phone over the hotspot NIC ---------------
  # - name: cell
  #   listen: 127.0.0.1:7894
  #   interface: wlan1
  #   upstream: socks5://198.51.100.1:9876   # dialed through wlan1

  # --- Source-IP-only binding (weak isolation, no privileges needed) --------
  # - name: by-ip
  #   listen: 127.0.0.1:7895
  #   bind_ip: 198.51.100.100

  # --- Failover lane: static candidates + auto-discovery ---------------------
  # The lane probes each candidate through its own NIC, pins every client
  # connection to one healthy candidate, and fails over on transport errors.
  # `discover` adds candidates from any device whose gateway answers on one of
  # the proxy ports (Linux-only, never scans subnets). Discovered entries rank
  # below static ones (priority 100 vs 1000).
  # - name: phone
  #   listen: 127.0.0.1:7893
  #   type: socks5
  #   candidates:
  #     - { interface: enx020000000001, upstream: "http://198.51.100.10:10808" }
  #     - { interface: enx020000000003, upstream: "http://198.51.100.20:10808", priority: 500 }
  #   discover:
  #     interfaces: ["device"]      # names, globs, "device", or "any"; lo excluded
  #     ports: [10808, 10809]       # optional per-lane override
  #     interval: 10s
  #     probe_url: https://www.gstatic.com/generate_204
  #     # via:                      # gateway overrides when DHCP cannot be read
  #     #   enx020000000001: 198.51.100.10
